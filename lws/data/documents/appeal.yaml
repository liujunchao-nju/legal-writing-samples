type: appeal
label: 民事上诉状
category: 民事诉讼文书
usage: 当事人不服地方人民法院第一审判决或裁定，在法定期限内向上一级人民法院提交。

legal_basis:
  - 民事诉讼法第171条
  - 民事诉讼法第172条

structure:
  - 文书标题：民事上诉状
  - 上诉人身份信息
  - 被上诉人身份信息
  - 原审法院名称、原审案号与案由
  - 上诉请求
  - 上诉理由
  - 此致上一级人民法院
  - 上诉人签名（盖章）与日期

elements:
  - id: appellant
    label: 上诉人身份信息
    required: true
    keywords: [上诉人]
    basis:
      - 民事诉讼法第172条
    note: 写明姓名，法人或其他组织写名称及其法定代表人或主要负责人姓名；一审中的诉讼地位一并注明，便于二审法院对应卷宗。

  - id: appellee
    label: 被上诉人身份信息
    required: true
    keywords: [被上诉人]
    basis:
      - 民事诉讼法第172条
    note: 被上诉人通常是一审的对方当事人。若一审其他当事人未上诉，其诉讼地位为「原审被告」或「原审原告」，应在文书中分别列明。

  - id: original-case
    label: 原审法院名称、案号与案由
    required: true
    keywords: [原审, 一审]
    basis:
      - 民事诉讼法第172条
    note: 第 172 条明确要求写明原审人民法院名称、案件的编号和案由，三者在实务中缺一不可。

  - id: deadline
    label: 上诉期限核对
    required: false
    keywords: [上诉期限, 十五日, 十日, 送达之日]
    basis:
      - 民事诉讼法第171条
    note: 判决十五日、裁定十日，自送达之日起算。逾期上诉会被裁定驳回，递交前务必核对送达日期。

  - id: prayer
    label: 上诉请求
    required: true
    keywords: [上诉请求]
    basis:
      - 民事诉讼法第172条
    note: 明确请求撤销或改判哪一项判项、改判为什么内容，避免只写「请求二审法院依法改判」。

  - id: reasons
    label: 上诉理由
    required: true
    keywords: [上诉理由]
    basis:
      - 民事诉讼法第172条
    note: 逐项对应原审判决的论证，指出是认定事实错误还是适用法律错误，不要笼统重复一审主张。

  - id: court
    label: 递交法院
    required: true
    keywords: [此致]
    basis:
      - 民事诉讼法第172条
    note: 上诉状可通过原审法院递交，也可直接递交上一级人民法院。

  - id: signature
    label: 上诉人签名与日期
    required: true
    keywords: [上诉人（签名）, 上诉人签名, （签名）, 盖章]
    basis:
      - 民事诉讼法第172条
    note: 自然人签名或捺印，法人加盖公章并由法定代表人签名。日期应与递交日一致，且不得晚于上诉期限的届满日。

tips:
  - 上诉理由要区分事实认定错误与法律适用错误，两者的证明门槛和审查标准不同。
  - 二审可以补充证据，但需说明为何一审未提交，否则可能不被采纳。
  - 上诉请求的范围决定二审审理范围，超出上诉请求的部分二审一般不予处理。
