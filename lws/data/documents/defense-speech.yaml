type: defense-speech
label: 刑事辩护词
category: 刑事诉讼文书
usage: 辩护人在法庭辩论阶段就定罪与量刑发表的辩护意见。

party_notes:
  辩护人: 围绕事实、证据、法律适用、量刑情节分层论证；明确无罪辩护或罪轻辩护，援引法定从宽情节。
  被告人: 如实供述、认罪认罚可从宽；有权自行辩护或委托、指定辩护人。

legal_basis:
  - 刑事诉讼法第37条
  - 刑法第27条
  - 刑法第67条

structure:
  - 称谓：审判长、审判员（人民陪审员）
  - 辩护人身份与委托来源
  - 对指控的总括意见
  - 辩护意见（分项：事实证据、定性、共同犯罪地位、从宽情节）
  - 量刑建议与法律依据
  - 结语
  - 辩护人署名与日期

elements:
  - id: opening
    label: 称谓与辩护人身份
    required: true
    keywords: [审判长, 辩护人]
    basis:
      - 刑事诉讼法第37条
    note: 开头写「审判长、审判员」，随后说明辩护人身份、所在机构与受委托或受指派情况，并声明已查阅案卷、会见被告人。

  - id: overall
    label: 对指控的总括意见
    required: true
    keywords: [指控, 定性, 罪名]
    basis:
      - 刑事诉讼法第37条
    note: 一句话给出总体立场：对罪名是否有异议、是否作罪轻辩护。先把框架给出来，再展开。

  - id: facts-opinion
    label: 事实与证据方面的意见
    required: false
    keywords: [证据, 事实认定]
    basis:
      - 刑事诉讼法第37条
    note: 围绕证据的合法性、真实性、关联性展开，指出指控证据链条的薄弱环节，但不对无争议事实作无谓纠缠。

  - id: role
    label: 共同犯罪中的地位与作用
    required: false
    keywords: [从犯, 次要作用, 辅助作用]
    basis:
      - 刑法第27条
    note: 若被告人系从犯，应结合分工、获利、参与次数与时长论证其起次要或辅助作用，并主张应当从轻、减轻或者免除处罚。

  - id: leniency
    label: 从宽情节
    required: true
    keywords: [认罪认罚, 如实供述, 从轻处罚, 初犯]
    basis:
      - 刑法第67条
    note: 认罪认罚、如实供述、自首、退赃退赔、修复受损法益等从宽情节应逐项列明，并对应到具体证据与法条，不作空泛表态。

  - id: sentence
    label: 量刑建议
    required: true
    keywords: [量刑, 建议, 判处]
    basis:
      - 刑事诉讼法第37条
    note: 辩护意见要落到明确结论，例如建议适用缓刑，或建议在某一幅度内从轻处罚，并与从宽情节一一对应。

  - id: closing
    label: 结语与辩护人署名
    required: true
    keywords: [辩护人：, 辩护人（签名）]
    basis:
      - 刑事诉讼法第37条
    note: 结语重申核心请求，避免引入新论点。末尾写辩护人姓名与日期。

tips:
  - 辩护人的责任是提出无罪、罪轻或者减轻、免除刑事责任的材料和意见，不是代替被告人表态。
  - 量刑辩护要做功课：逐项梳理从宽情节并对应证据，比反复强调「情节轻微」有效得多。
  - 对被害人受损法益的修复（如增殖放流、赔偿损失）既是社会责任，也是实务中被明确纳入从轻考量的情节。
