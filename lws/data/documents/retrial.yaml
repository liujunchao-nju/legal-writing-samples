type: retrial
label: 民事再审申请书
category: 民事诉讼文书
usage: 当事人对已经发生法律效力的判决、裁定认为有错误，在期限内向上一级人民法院申请再审。

party_notes:
  再审申请人: 须落到法定再审事由；注意申请期限与材料清单，原审法院或上一级法院均可申请。
  被申请人: 可提交书面意见，围绕原判正确予以维持。

legal_basis:
  - 民事诉讼法第210条
  - 民事诉讼法第214条
  - 民事诉讼法第216条
  - 民诉法解释第375条

structure:
  - 文书标题：再审申请书
  - 再审申请人身份信息
  - 被申请人身份信息
  - 原审法院与案号（一审、二审及生效裁判）
  - 再审请求
  - 申请再审的法定事由
  - 事实与理由
  - 此致上一级人民法院
  - 申请人签名（盖章）与日期

elements:
  - id: applicant
    label: 再审申请人身份信息
    required: true
    keywords: [再审申请人, 申请人]
    basis:
      - 民事诉讼法第214条
    note: 写明姓名与联系方式；法人或其他组织写名称、住所与法定代表人。再审申请人通常是原审的败诉方或其权利义务承继人。

  - id: respondent
    label: 被申请人身份信息
    required: true
    keywords: [被申请人]
    basis:
      - 民事诉讼法第214条
    note: 被申请人为原审的对方当事人。再审申请书需按其人数提交副本，人数较多时先核对对方当事人名单。

  - id: original-cases
    label: 原审法院与各审级案号
    required: true
    keywords: [原审, 一案]
    basis:
      - 民事诉讼法第214条
    note: 应逐一列明一审、二审（如有）的法院、案号与裁判结果，并注明生效裁判的生效时间。生效时间是六个月期限的起算点。

  - id: prayer
    label: 再审请求
    required: true
    keywords: [再审请求, 请求再审]
    basis:
      - 民事诉讼法第210条
    note: 明确请求撤销哪一份生效裁判、指令再审还是提审，避免只写「请求依法再审」。

  - id: grounds
    label: 申请再审的法定事由
    required: true
    keywords: [再审事由, 法定情形, 证据不足, 适用法律确有错误]
    basis:
      - 民事诉讼法第210条
      - 民事诉讼法第216条
    note: 再审是法定事由审查程序，必须落到法定事由（如认定基本事实缺乏证据证明、原判决适用法律确有错误等），单纯表达不服不会启动再审。

  - id: deadline
    label: 六个月的申请期限
    required: false
    keywords: [六个月, 发生法律效力]
    basis:
      - 民事诉讼法第216条
    note: 自判决、裁定发生法律效力后六个月内提出。期限届满即为程序不可逆，应在开篇即写明未超期。

  - id: materials
    label: 随附材料
    required: false
    keywords: [副本, 原审判决, 身份证明]
    basis:
      - 民诉法解释第375条
    note: 再审申请书按被申请人及原审其他当事人人数提交副本，并附身份证明、原审裁判文书、主要证据材料。

  - id: court
    label: 受理法院
    required: true
    keywords: [此致]
    basis:
      - 民事诉讼法第210条
    note: 原则上向上一级人民法院申请再审；当事人一方人数众多或者双方均为公民的案件，也可以向原审法院申请。

  - id: signature
    label: 申请人签名与日期
    required: true
    keywords: [再审申请人（签名）, 盖章]
    basis:
      - 民事诉讼法第214条
    note: 申请人签名或盖章，并注明日期。再审申请有六个月的不变期间，日期与生效裁判时间的间隔应当清晰可查。

tips:
  - 再审程序不停止原判决的执行，申请再审的同时应评估是否需要申请中止执行并提供担保。
  - 再审审查阶段只审法定事由是否成立，把关的是「有没有再审的法定理由」，不是「谁更有理」。
  - 把最有力的法定事由放在第一位，审查法官通常以事由是否成立为导向阅读。
