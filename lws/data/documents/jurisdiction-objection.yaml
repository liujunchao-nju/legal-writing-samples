type: jurisdiction-objection
label: 管辖权异议申请书
category: 民事诉讼文书
usage: 当事人认为受诉人民法院对本案无管辖权，在提交答辩状期间向受诉法院提出，请求将案件移送有管辖权的人民法院。

party_notes:
  申请人: 异议须在提交答辩状期间（收到起诉状副本之日起十五日内）提出，逾期视为受诉法院有管辖权（专属或级别管辖除外）。
  被申请人: 被申请人可就管辖连接点提出抗辩；应诉答辩或提出反诉会视为接受管辖。

legal_basis:
  - 民事诉讼法第130条

structure:
  - 文书标题：管辖权异议申请书
  - 申请人身份信息
  - 被申请人身份信息
  - 请求事项
  - 事实与理由
  - 此致受诉人民法院
  - 申请人签名与日期

elements:
  - id: party-applicant
    label: 申请人身份信息
    required: true
    keywords: [申请人]
    parties: [申请人]
    basis:
      - 民事诉讼法第130条
    note: 一般为被告；写明姓名、住所、联系方式；法人写明名称、住所、法定代表人。

  - id: party-respondent
    label: 被申请人身份信息
    required: true
    keywords: [被申请人]
    parties: [被申请人]
    basis:
      - 民事诉讼法第130条
    note: 写明被申请人身份信息。

  - id: obj-request
    label: 请求事项
    required: true
    keywords: [请求事项, 请求, 移送]
    parties: [申请人]
    basis:
      - 民事诉讼法第130条
    note: 请求裁定将本案移送至有管辖权的人民法院。

  - id: obj-reason
    label: 事实与理由
    required: true
    keywords: [事实与理由, 事实和理由]
    basis:
      - 民事诉讼法第130条
    note: 说明受诉法院无管辖权的连接点（地域、级别、专属），援引管辖规则。

  - id: obj-court
    label: 受诉人民法院
    required: true
    keywords: [此致]
    basis:
      - 民事诉讼法第130条
    note: 向受诉人民法院提出；「此致」后写该法院全称。

  - id: obj-signature
    label: 申请人签名与日期
    required: true
    keywords: [申请人, 具状人]
    basis:
      - 民事诉讼法第130条
    note: 申请人签名或盖章；日期写提交日。

tips:
  - 时间红线：须在答辩期内（收到起诉状副本之日起十五日内）提出，逾期失权。
  - 应诉答辩或反诉会构成「应诉管辖」，慎防无意间接受无管辖权法院的管辖。
  - 异议成立则移送，不成立则驳回；裁定可上诉。
