type: evidence-investigation
label: 调查收集证据申请书
category: 民事诉讼文书
usage: 当事人及其诉讼代理人因客观原因不能自行收集的证据，申请人民法院调查收集。

party_notes:
  申请人: 限于「因客观原因不能自行收集」的证据（如银行账户、登记档案、第三方留存材料），应说明不能自行收集的理由。
  被申请人: 被申请人可就证据关联性与必要性提出意见；法院认为审理需要的也可主动调查。

legal_basis:
  - 民事诉讼法第67条
  - 民事诉讼法第64条

structure:
  - 文书标题：调查收集证据申请书
  - 申请人身份信息
  - 被申请人身份信息
  - 请求调查收集的证据
  - 事实与理由
  - 此致受理案件的人民法院
  - 申请人签名与日期

elements:
  - id: party-applicant
    label: 申请人身份信息
    required: true
    keywords: [申请人]
    parties: [申请人]
    basis:
      - 民事诉讼法第67条
    note: 写明姓名、住所、联系方式；代理律师一并写明。

  - id: party-respondent
    label: 被申请人身份信息
    required: true
    keywords: [被申请人]
    parties: [被申请人]
    basis:
      - 民事诉讼法第67条
    note: 写明被申请人身份信息，便于法院指向证据持有人或直接关系人。

  - id: evidence-target
    label: 请求调查收集的证据
    required: true
    keywords: [请求事项, 请求调查, 调查收集]
    parties: [申请人]
    basis:
      - 民事诉讼法第67条
    note: 具体列明证据名称、持有机关或单位、与待证事实的关联；指向明确便于法院调取。

  - id: evidence-reason
    label: 事实与理由
    required: true
    keywords: [事实与理由, 事实和理由]
    basis:
      - 民事诉讼法第67条
      - 民事诉讼法第64条
    note: 重点说明「因客观原因不能自行收集」及该证据对本案的关键性；可附线索。

  - id: evidence-court
    label: 受理案件的人民法院
    required: true
    keywords: [此致]
    basis:
      - 民事诉讼法第67条
    note: 向受理本案的人民法院提出；「此致」后写法院全称。

  - id: evidence-signature
    label: 申请人签名与日期
    required: true
    keywords: [申请人, 具状人]
    basis:
      - 民事诉讼法第67条
    note: 申请人签名或盖章；代理律师签名的应附授权委托书。

tips:
  - 申请法院调查取证有门槛：必须是当事人因客观原因不能自行收集，而非单纯图省事。
  - 律师持调查令调取是常见替代路径，可一并说明。
  - 申请应在举证期限届满前提出，逾期可能不被准许。
