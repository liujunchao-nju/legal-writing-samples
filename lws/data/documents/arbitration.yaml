type: arbitration
label: 劳动争议仲裁申请书
category: 劳动争议文书
usage: 劳动者或用人单位在起诉前向劳动人事争议仲裁委员会提出仲裁申请。

legal_basis:
  - 劳动争议调解仲裁法第2条
  - 劳动争议调解仲裁法第5条
  - 劳动争议调解仲裁法第27条

structure:
  - 文书标题：劳动仲裁申请书
  - 申请人身份信息
  - 被申请人（用人单位）信息
  - 仲裁请求
  - 事实与理由
  - 证据清单
  - 此致劳动人事争议仲裁委员会
  - 申请人签名与日期

elements:
  - id: claimant
    label: 申请人身份信息
    required: true
    keywords: [申请人]
    basis:
      - 劳动争议调解仲裁法第2条
    note: 写明姓名、性别、出生日期、住所、联系电话；委托代理人的同时写明代理人身份。

  - id: respondent
    label: 被申请人信息
    required: true
    keywords: [被申请人]
    basis:
      - 劳动争议调解仲裁法第2条
    note: 用人单位名称、住所、法定代表人或者主要负责人姓名与职务，以及统一社会信用代码。

  - id: claims
    label: 仲裁请求
    required: true
    keywords: [仲裁请求]
    basis:
      - 劳动争议调解仲裁法第2条
    note: 请求事项须属于第 2 条列举的受案范围。确认劳动关系、经济补偿、加班费、未签书面合同二倍工资等应分项列明金额。

  - id: facts
    label: 事实与理由
    required: true
    keywords: [事实与理由, 事实和理由]
    basis:
      - 劳动争议调解仲裁法第2条
    note: 重点写清用工起止时间、岗位、报酬标准与管理从属性，这是认定劳动关系的基础。

  - id: limitation
    label: 仲裁时效说明
    required: false
    keywords: [仲裁时效, 时效]
    basis:
      - 劳动争议调解仲裁法第27条
    note: 时效为一年，自知道或者应当知道权利被侵害之日起算。劳动关系存续期间因拖欠劳动报酬争议不受一年限制，终止的应自终止之日起一年内提出。时效临近的应当写明中断事由。

  - id: evidence
    label: 证据清单
    required: true
    keywords: [证据]
    basis:
      - 劳动争议调解仲裁法第2条
    note: 劳动合同、工资流水、考勤记录、工作沟通记录等。管理从属性的证据（排班、考核、报销审批）往往是胜负关键。

  - id: commission
    label: 受诉仲裁机构
    required: true
    keywords: [此致]
    basis:
      - 劳动争议调解仲裁法第5条
    note: 向劳动合同履行地或者用人单位所在地的劳动人事争议仲裁委员会申请。

  - id: signature
    label: 申请人签名与日期
    required: true
    keywords: [申请人（签名）, 申请人签名, 签名]
    basis:
      - 劳动争议调解仲裁法第5条
    note: 申请人签名或捺印，委托代理人的同时提交授权委托书。日期影响仲裁时效的计算，应写实际提交日。

tips:
  - 劳动争议实行仲裁前置，未经仲裁不能直接起诉，但仲裁裁决后不服的可以起诉。
  - 请求金额要算清楚并写明计算过程，仲裁员会据此核算，模糊表述容易被裁减。
  - 举证责任有倾斜：与争议事项有关的证据由用人单位掌握管理的，用人单位应当提供。
