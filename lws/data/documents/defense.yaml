type: defense
label: 民事答辩状
category: 民事诉讼文书
usage: 被告收到起诉状副本后，在法定期限内向人民法院提交的书面答辩意见。

party_notes:
  被告: 十五日内提交答辩状；可主张管辖权异议、实体抗辩或提出反诉；针对原告诉请逐项回应，不要回避关键请求。
  原告: 关注对方是否提出反诉或管辖异议，提前准备应对与反证。

legal_basis:
  - 民事诉讼法第128条

structure:
  - 文书标题：民事答辩状
  - 答辩人身份信息
  - 案件标识（因××纠纷一案及案号）
  - 答辩请求
  - 答辩理由（分项）
  - 此致受诉人民法院
  - 答辩人签名（盖章）与日期

elements:
  - id: respondent
    label: 答辩人身份信息
    required: true
    keywords: [答辩人]
    basis:
      - 民事诉讼法第128条
    note: 依第 128 条记明姓名、性别、年龄、民族、职业、工作单位、住所、联系方式；法人或其他组织写名称、住所和法定代表人或者主要负责人的姓名与职务。

  - id: case-reference
    label: 案件标识
    required: true
    keywords: [案号, 一案]
    basis:
      - 民事诉讼法第128条
    note: 写明「因××纠纷一案」，并注明案号与受诉法院，便于归档与检索。

  - id: prayer
    label: 答辩请求
    required: true
    keywords: [答辩请求, 请求驳回, 请求法院驳回]
    basis:
      - 民事诉讼法第128条
    note: 先给结论，明确请求驳回全部诉请还是部分驳回，避免笼统写「请求依法裁判」。

  - id: reasons
    label: 答辩理由
    required: true
    keywords: [答辩理由, 答辩意见]
    basis:
      - 民事诉讼法第128条
    note: 分项展开，每一项对应原告的一项主张。抗辩体系可分三类：程序抗辩（管辖、主体）、事实抗辩（否认要件事实）、权利抗辩（时效、抵销、同时履行）。

  - id: court
    label: 受诉人民法院
    required: true
    keywords: [此致]
    basis:
      - 民事诉讼法第128条
    note: 答辩状递交受诉法院，与起诉状所列法院一致。若对管辖有异议，应在答辩期内另行提出管辖权异议，不写在答辩状正文中。

  - id: signature
    label: 答辩人签名与日期
    required: true
    keywords: [答辩人（签名）, 答辩人签名, 盖章]
    basis:
      - 民事诉讼法第128条
    note: 答辩期自收到起诉状副本之日起十五日；不提出答辩状不影响法院审理，但会丧失先行固定争点的机会。

tips:
  - 答辩状的首要功能是固定争点，把「不认可什么、认可什么」讲清楚，避免庭审时被动。
  - 承认事实不等于承认责任，无争议事实可明确认可，反而能收缩审理范围。
  - 反诉与本诉可以一并提出，但反诉需要另行交纳受理费。
