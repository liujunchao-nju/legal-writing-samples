type: complaint
label: 民事起诉状
category: 民事诉讼文书
usage: 原告或其代理人向有管辖权的人民法院提交，据以启动第一审程序。

legal_basis:
  - 民事诉讼法第122条
  - 民事诉讼法第124条

structure:
  - 文书标题：民事起诉状
  - 原告身份信息
  - 被告身份信息
  - 诉讼请求
  - 事实与理由
  - 证据和证据来源
  - 此致受诉人民法院
  - 具状人签名（盖章）与日期

elements:
  - id: party-plaintiff
    label: 原告身份信息
    required: true
    keywords: [原告]
    basis:
      - 民事诉讼法第124条
    note: 自然人写明姓名、性别、年龄、民族、职业、工作单位、住所、联系方式；法人或其他组织写明名称、住所、法定代表人或者主要负责人的姓名与职务。缺项会被要求补正。

  - id: party-defendant
    label: 被告身份信息
    required: true
    keywords: [被告]
    basis:
      - 民事诉讼法第124条
    note: 被告姓名、性别、工作单位、住所等信息；法人或其他组织写名称与住所。被告不明确的，起诉会被裁定不予受理。

  - id: claims
    label: 诉讼请求
    required: true
    keywords: [诉讼请求]
    basis:
      - 民事诉讼法第124条
    note: 请求须具体、可执行；本金与利息分开列明并写清计算方式与截止日；多项请求分项编号。

  - id: facts
    label: 事实与理由
    required: true
    keywords: [事实与理由, 事实和理由]
    basis:
      - 民事诉讼法第124条
    note: 按时间顺序陈述，每一段事实对应一组证据；理由部分要落到请求权基础与法条上，不做情绪化表达。

  - id: evidence
    label: 证据和证据来源
    required: true
    keywords: [证据]
    basis:
      - 民事诉讼法第124条
    note: 列明证据名称、页数与证明目的；有证人的写明姓名和住所。证据较多时另附证据清单。

  - id: court
    label: 受诉人民法院
    required: true
    keywords: [此致]
    basis:
      - 民事诉讼法第122条
    note: 「此致」后另起一行写受诉法院全称。管辖依据要同时满足地域管辖与级别管辖。

  - id: signature
    label: 具状人签名与日期
    required: true
    keywords: [具状人, 起诉人]
    basis:
      - 民事诉讼法第124条
    note: 自然人签名或捺印，法人加盖公章并由法定代表人签名；日期写实际提交日，与诉讼时效的计算相关。

tips:
  - 诉讼请求与事实理由一一对应，法官读请求即知争议何在。
  - 管辖法院的选择是策略问题：合同纠纷可选被告住所地或合同履行地，标的额决定级别管辖。
  - 起诉状不必写尽全部证据，但应给出证据线索，便于法院立案与送达。
