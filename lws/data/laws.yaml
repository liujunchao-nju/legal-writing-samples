# 经核验的法条库。
#
# 范文与文书要素里出现的每一处法条依据，都必须以 key 的形式出现在本文件中，
# 否则 `lws verify` 与单元测试会报错。目的是让文书里的条号都是查过的，而不是想起来的。
#
# 条文原文经法律数据库按「法规名称 + 条号」逐条调取，均确认现行有效。
# 民事诉讼法条号在 2023 年修正后整体位移（例如上诉状内容由原第 165 条移至第 172 条），
# 因此本库一律以现行条文号为准，不沿用旧号。

verified_on: "2026-10-16"
verified_by: 壮壮猫法律 MCP（ailawcat-mcp）逐条检索
note: 条号与条文内容一一对应，均已确认现行有效。引用本库以外的法条视为未核验。

laws:
  # ── 民事诉讼法（2023 修正，2024.1.1 施行）────────────────
  - key: 民事诉讼法第122条
    law: 中华人民共和国民事诉讼法
    article: 122
    title: 起诉必须符合的四项条件
    text: "起诉必须符合下列条件：（一）原告是与本案有直接利害关系的公民、法人和其他组织；（二）有明确的被告；（三）有具体的诉讼请求和事实、理由；（四）属于人民法院受理民事诉讼的范围和受诉人民法院管辖。"
    effective_from: "2024-01-01"
    authority: 法律

  - key: 民事诉讼法第124条
    law: 中华人民共和国民事诉讼法
    article: 124
    title: 起诉状应当记明的事项
    text: "起诉状应当记明下列事项：（一）原告的姓名、性别、年龄、民族、职业、工作单位、住所、联系方式，法人或者其他组织的名称、住所和法定代表人或者主要负责人的姓名、职务、联系方式；（二）被告的姓名、性别、工作单位、住所等信息，法人或者其他组织的名称、住所等信息；（三）诉讼请求和所根据的事实与理由；（四）证据和证据来源，证人姓名和住所。"
    effective_from: "2024-01-01"
    authority: 法律

  - key: 民事诉讼法第128条
    law: 中华人民共和国民事诉讼法
    article: 128
    title: 答辩状的提出与应当记明的事项
    text: "人民法院应当在立案之日起五日内将起诉状副本发送被告，被告应当在收到之日起十五日内提出答辩状。答辩状应当记明被告的姓名、性别、年龄、民族、职业、工作单位、住所、联系方式；法人或者其他组织的名称、住所和法定代表人或者主要负责人的姓名、职务、联系方式。人民法院应当在收到答辩状之日起五日内将答辩状副本发送原告。被告不提出答辩状的，不影响人民法院审理。"
    effective_from: "2024-01-01"
    authority: 法律

  - key: 民事诉讼法第171条
    law: 中华人民共和国民事诉讼法
    article: 171
    title: 上诉期限：判决十五日、裁定十日
    text: "当事人不服地方人民法院第一审判决的，有权在判决书送达之日起十五日内向上一级人民法院提起上诉。当事人不服地方人民法院第一审裁定的，有权在裁定书送达之日起十日内向上一级人民法院提起上诉。"
    effective_from: "2024-01-01"
    authority: 法律

  - key: 民事诉讼法第172条
    law: 中华人民共和国民事诉讼法
    article: 172
    title: 上诉状应当包括的内容
    text: "上诉应当递交上诉状。上诉状的内容，应当包括当事人的姓名，法人的名称及其法定代表人的姓名或者其他组织的名称及其主要负责人的姓名；原审人民法院名称、案件的编号和案由；上诉的请求和理由。"
    effective_from: "2024-01-01"
    authority: 法律

  - key: 民事诉讼法第210条
    law: 中华人民共和国民事诉讼法
    article: 210
    title: 当事人申请再审的管辖与效果
    text: "当事人对已经发生法律效力的判决、裁定，认为有错误的，可以向上一级人民法院申请再审；当事人一方人数众多或者当事人双方为公民的案件，也可以向原审人民法院申请再审。当事人申请再审的，不停止判决、裁定的执行。"
    effective_from: "2024-01-01"
    authority: 法律

  - key: 民事诉讼法第214条
    law: 中华人民共和国民事诉讼法
    article: 214
    title: 再审申请书的提交与对方当事人的书面意见
    text: "当事人申请再审的，应当提交再审申请书等材料。人民法院应当自收到再审申请书之日起五日内将再审申请书副本发送对方当事人。对方当事人应当自收到再审申请书副本之日起十五日内提交书面意见；不提交书面意见的，不影响人民法院审查。人民法院可以要求申请人和对方当事人补充有关材料，询问有关事项。"
    effective_from: "2024-01-01"
    authority: 法律

  - key: 民事诉讼法第216条
    law: 中华人民共和国民事诉讼法
    article: 216
    title: 再审申请期限：六个月
    text: "当事人申请再审，应当在判决、裁定发生法律效力后六个月内提出；有本法第二百一十一条第一项、第三项、第十二项、第十三项规定情形的，自知道或者应当知道之日起六个月内提出。"
    effective_from: "2024-01-01"
    authority: 法律

  # ── 民事诉讼法司法解释（2022 修正）──────────────────────
  - key: 民诉法解释第375条
    law: 最高人民法院关于适用《中华人民共和国民事诉讼法》的解释
    article: 375
    title: 申请再审应当提交的材料
    text: "当事人申请再审，应当提交下列材料：（一）再审申请书，并按照被申请人和原审其他当事人的人数提交副本；（二）再审申请人是自然人的，应当提交身份证明；再审申请人是法人或者其他组织的，应当提交营业执照、组织机构代码证书、法定代表人或者主要负责人身份证明书。委托他人代为申请的，应当提交授权委托书和代理人身份证明；（三）原审判决书、裁定书、调解书；（四）反映案件基本事实的主要证据及其他材料。前款第二项、第三项、第四项规定的材料可以是与原件核对无异的复印件。"
    effective_from: "2022-04-10"
    authority: 司法解释

  # ── 劳动争议调解仲裁法 ─────────────────────────────────
  - key: 劳动争议调解仲裁法第2条
    law: 中华人民共和国劳动争议调解仲裁法
    article: 2
    title: 劳动争议仲裁的适用范围
    text: "中华人民共和国境内的用人单位与劳动者发生的下列劳动争议，适用本法：（一）因确认劳动关系发生的争议；（二）因订立、履行、变更、解除和终止劳动合同发生的争议；（三）因除名、辞退和辞职、离职发生的争议；（四）因工作时间、休息休假、社会保险、福利、培训以及劳动保护发生的争议；（五）因劳动报酬、工伤医疗费、经济补偿或者赔偿金等发生的争议；（六）法律、法规规定的其他劳动争议。"
    effective_from: "2008-05-01"
    authority: 法律

  - key: 劳动争议调解仲裁法第5条
    law: 中华人民共和国劳动争议调解仲裁法
    article: 5
    title: 劳动争议处理的基本程序：先仲裁后诉讼
    text: "发生劳动争议，当事人不愿协商、协商不成或者达成和解协议后不履行的，可以向调解组织申请调解；不愿调解、调解不成或者达成调解协议后不履行的，可以向劳动争议仲裁委员会申请仲裁；对仲裁裁决不服的，除本法另有规定的外，可以向人民法院提起诉讼。"
    effective_from: "2008-05-01"
    authority: 法律

  - key: 劳动争议调解仲裁法第27条
    law: 中华人民共和国劳动争议调解仲裁法
    article: 27
    title: 仲裁时效：一年
    text: "劳动争议申请仲裁的时效期间为一年。仲裁时效期间从当事人知道或者应当知道其权利被侵害之日起计算。因当事人一方向对方当事人主张权利，或者向有关部门请求权利救济，或者对方当事人同意履行义务而中断的，从中断时起，仲裁时效期间重新计算。因不可抗力或者有其他正当理由，当事人不能在本条第一款规定的仲裁时效期间申请仲裁的，仲裁时效中止。从中止时效的原因消除之日起，仲裁时效期间继续计算。劳动关系存续期间因拖欠劳动报酬发生争议的，劳动者申请仲裁不受本条第一款规定的仲裁时效期间的限制；但是，劳动关系终止的，应当自劳动关系终止之日起一年内提出。"
    effective_from: "2008-05-01"
    authority: 法律

  # ── 刑法（2023 修正）与刑事诉讼法 ──────────────────────
  - key: 刑法第27条
    law: 中华人民共和国刑法
    article: 27
    title: 从犯的认定与处罚
    text: "在共同犯罪中起次要或者辅助作用的，是从犯。对于从犯，应当从轻、减轻处罚或者免除处罚。"
    effective_from: "2024-03-01"
    authority: 法律

  - key: 刑法第67条
    law: 中华人民共和国刑法
    article: 67
    title: 自首与坦白
    text: "犯罪以后自动投案，如实供述自己的罪行的，是自首。对于自首的犯罪分子，可以从轻或者减轻处罚。其中，犯罪较轻的，可以免除处罚。被采取强制措施的犯罪嫌疑人、被告人和正在服刑的罪犯，如实供述司法机关还未掌握的本人其他罪行的，以自首论。犯罪嫌疑人虽不具有前两款规定的自首情节，但是如实供述自己罪行的，可以从轻处罚；因其如实供述自己罪行，避免特别严重后果发生的，可以减轻处罚。"
    effective_from: "2024-03-01"
    authority: 法律

  - key: 刑法第340条
    law: 中华人民共和国刑法
    article: 340
    title: 非法捕捞水产品罪
    text: "违反保护水产资源法规，在禁渔区、禁渔期或者使用禁用的工具、方法捕捞水产品，情节严重的，处三年以下有期徒刑、拘役、管制或者罚金。"
    effective_from: "2024-03-01"
    authority: 法律

  - key: 刑事诉讼法第37条
    law: 中华人民共和国刑事诉讼法
    article: 37
    title: 辩护人的责任
    text: "辩护人的责任是根据事实和法律，提出犯罪嫌疑人、被告人无罪、罪轻或者减轻、免除其刑事责任的材料和意见，维护犯罪嫌疑人、被告人的诉讼权利和其他合法权益。"
    effective_from: "2018-10-26"
    authority: 法律

  # ── 民法典（合同通则相关，供文书实体理由引用）────────────
  - key: 民法典第509条
    law: 中华人民共和国民法典
    article: 509
    title: 全面履行义务与诚信原则
    text: "当事人应当按照约定全面履行自己的义务。当事人应当遵循诚信原则，根据合同的性质、目的和交易习惯履行通知、协助、保密等义务。当事人在履行合同过程中，应当避免浪费资源、污染环境和破坏生态。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第563条
    law: 中华人民共和国民法典
    article: 563
    title: 法定解除的五种情形
    text: "有下列情形之一的，当事人可以解除合同：（一）因不可抗力致使不能实现合同目的；（二）在履行期限届满前，当事人一方明确表示或者以自己的行为表明不履行主要债务；（三）当事人一方迟延履行主要债务，经催告后在合理期限内仍未履行；（四）当事人一方迟延履行债务或者有其他违约行为致使不能实现合同目的；（五）法律规定的其他情形。以持续履行的债务为内容的不定期合同，当事人可以随时解除合同，但是应当在合理期限之前通知对方。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第577条
    law: 中华人民共和国民法典
    article: 577
    title: 违约责任的一般形态
    text: "当事人一方不履行合同义务或者履行合同义务不符合约定的，应当承担继续履行、采取补救措施或者赔偿损失等违约责任。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 民法典第585条
    law: 中华人民共和国民法典
    article: 585
    title: 违约金的约定与司法调整
    text: "当事人可以约定一方违约时应当根据违约情况向对方支付一定数额的违约金，也可以约定因违约产生的损失赔偿额的计算方法。约定的违约金低于造成的损失的，人民法院或者仲裁机构可以根据当事人的请求予以增加；约定的违约金过分高于造成的损失的，人民法院或者仲裁机构可以根据当事人的请求予以适当减少。当事人就迟延履行约定违约金的，违约方支付违约金后，还应当履行债务。"
    effective_from: "2021-01-01"
    authority: 法律

  # ── 劳动合同法（劳动争议文书引用）──────────────────────
  - key: 劳动合同法第38条
    law: 中华人民共和国劳动合同法
    article: 38
    title: 劳动者单方解除劳动合同的法定情形
    text: "用人单位有下列情形之一的，劳动者可以解除劳动合同：（一）未按照劳动合同约定提供劳动保护或者劳动条件的；（二）未及时足额支付劳动报酬的；（三）未依法为劳动者缴纳社会保险费的；（四）用人单位的规章制度违反法律、法规的规定，损害劳动者权益的；（五）因本法第二十六条第一款规定的情形致使劳动合同无效的；（六）法律、行政法规规定劳动者可以解除劳动合同的其他情形。用人单位以暴力、威胁或者非法限制人身自由的手段强迫劳动者劳动的，或者用人单位违章指挥、强令冒险作业危及劳动者人身安全的，劳动者可以立即解除劳动合同，不需事先告知用人单位。"
    effective_from: "2013-07-01"
    authority: 法律

  - key: 劳动合同法第46条
    law: 中华人民共和国劳动合同法
    article: 46
    title: 用人单位应当支付经济补偿的七种情形
    text: "有下列情形之一的，用人单位应当向劳动者支付经济补偿：（一）劳动者依照本法第三十八条规定解除劳动合同的；（二）用人单位依照本法第三十六条规定向劳动者提出解除劳动合同并与劳动者协商一致解除劳动合同的；（三）用人单位依照本法第四十条规定解除劳动合同的；（四）用人单位依照本法第四十一条第一款规定解除劳动合同的；（五）除用人单位维持或者提高劳动合同约定条件续订劳动合同，劳动者不同意续订的情形外，依照本法第四十四条第一项规定终止固定期限劳动合同的；（六）依照本法第四十四条第四项、第五项规定终止劳动合同的；（七）法律、行政法规规定的其他情形。"
    effective_from: "2013-07-01"
    authority: 法律

  - key: 劳动合同法第47条
    law: 中华人民共和国劳动合同法
    article: 47
    title: 经济补偿的计算标准
    text: "经济补偿按劳动者在本单位工作的年限，每满一年支付一个月工资的标准向劳动者支付。六个月以上不满一年的，按一年计算；不满六个月的，向劳动者支付半个月工资的经济补偿。劳动者月工资高于用人单位所在直辖市、设区的市级人民政府公布的本地区上年度职工月平均工资三倍的，向其支付经济补偿的标准按职工月平均工资三倍的数额支付，向其支付经济补偿的年限最高不超过十二年。本条所称月工资是指劳动者在劳动合同解除或者终止前十二个月的平均工资。"
    effective_from: "2013-07-01"
    authority: 法律

  # ── 民事诉讼法（2023 修正，补充：保全/管辖/反诉/撤诉/督促/执行）────────
  - key: 民事诉讼法第64条
    law: 中华人民共和国民事诉讼法
    article: 64
    title: 诉讼代理人的调查收集证据权
    text: "代理诉讼的律师和其他诉讼代理人有权调查收集证据，可以查阅本案有关材料。查阅本案有关材料的范围和办法由最高人民法院规定。"
    effective_from: "2024-01-01"
    authority: 法律

  - key: 民事诉讼法第67条
    law: 中华人民共和国民事诉讼法
    article: 67
    title: 举证责任与人民法院依职权调查收集证据
    text: "当事人对自己提出的主张，有责任提供证据。当事人及其诉讼代理人因客观原因不能自行收集的证据，或者人民法院认为审理案件需要的证据，人民法院应当调查收集。人民法院应当按照法定程序，全面地、客观地审查核实证据。"
    effective_from: "2024-01-01"
    authority: 法律

  - key: 民事诉讼法第103条
    law: 中华人民共和国民事诉讼法
    article: 103
    title: 诉讼保全与行为保全
    text: "人民法院对于可能因当事人一方的行为或者其他原因，使判决难以执行或者造成当事人其他损害的案件，根据对方当事人的申请，可以裁定对其财产进行保全、责令其作出一定行为或者禁止其作出一定行为；当事人没有提出申请的，人民法院在必要时也可以裁定采取保全措施。人民法院采取保全措施，可以责令申请人提供担保，申请人不提供担保的，裁定驳回申请。人民法院接受申请后，对情况紧急的，必须在四十八小时内作出裁定；裁定采取保全措施的，应当立即开始执行。"
    effective_from: "2024-01-01"
    authority: 法律

  - key: 民事诉讼法第104条
    law: 中华人民共和国民事诉讼法
    article: 104
    title: 诉前财产保全
    text: "利害关系人因情况紧急，不立即申请保全将会使其合法权益受到难以弥补的损害的，可以在提起诉讼或者申请仲裁前向被保全财产所在地、被申请人住所地或者对案件有管辖权的人民法院申请采取保全措施。申请人应当提供担保，不提供担保的，裁定驳回申请。人民法院接受申请后，必须在四十八小时内作出裁定；裁定采取保全措施的，应当立即开始执行。申请人在人民法院采取保全措施后三十日内不依法提起诉讼或者申请仲裁的，人民法院应当解除保全。"
    effective_from: "2024-01-01"
    authority: 法律

  - key: 民事诉讼法第105条
    law: 中华人民共和国民事诉讼法
    article: 105
    title: 保全的范围
    text: "保全限于请求的范围，或者与本案有关的财物。"
    effective_from: "2024-01-01"
    authority: 法律

  - key: 民事诉讼法第108条
    law: 中华人民共和国民事诉讼法
    article: 108
    title: 保全申请错误的赔偿
    text: "申请有错误的，申请人应当赔偿被申请人因保全所遭受的损失。"
    effective_from: "2024-01-01"
    authority: 法律

  - key: 民事诉讼法第126条
    law: 中华人民共和国民事诉讼法
    article: 126
    title: 立案登记与受理
    text: "人民法院应当保障当事人依照法律规定享有的起诉权利。对符合本法第一百二十二条的起诉，必须受理。符合起诉条件的，应当在七日内立案，并通知当事人；不符合起诉条件的，应当在七日内作出裁定书，不予受理；原告对裁定不服的，可以提起上诉。"
    effective_from: "2024-01-01"
    authority: 法律

  - key: 民事诉讼法第130条
    law: 中华人民共和国民事诉讼法
    article: 130
    title: 管辖权异议
    text: "人民法院受理案件后，当事人对管辖权有异议的，应当在提交答辩状期间提出。人民法院对当事人提出的异议，应当审查。异议成立的，裁定将案件移送有管辖权的人民法院；异议不成立的，裁定驳回。当事人未提出管辖异议，并应诉答辩或者提出反诉的，视为受诉人民法院有管辖权，但违反级别管辖和专属管辖规定的除外。"
    effective_from: "2024-01-01"
    authority: 法律

  - key: 民事诉讼法第143条
    law: 中华人民共和国民事诉讼法
    article: 143
    title: 反诉与诉讼请求的合并审理
    text: "原告增加诉讼请求，被告提出反诉，第三人提出与本案有关的诉讼请求，可以合并审理。"
    effective_from: "2024-01-01"
    authority: 法律

  - key: 民事诉讼法第146条
    law: 中华人民共和国民事诉讼法
    article: 146
    title: 按撤诉处理
    text: "原告经传票传唤，无正当理由拒不到庭的，或者未经法庭许可中途退庭的，可以按撤诉处理；被告反诉的，可以缺席判决。"
    effective_from: "2024-01-01"
    authority: 法律

  - key: 民事诉讼法第148条
    law: 中华人民共和国民事诉讼法
    article: 148
    title: 宣判前申请撤诉
    text: "宣判前，原告申请撤诉的，是否准许，由人民法院裁定。人民法院裁定不准许撤诉的，原告经传票传唤，无正当理由拒不到庭的，可以缺席判决。"
    effective_from: "2024-01-01"
    authority: 法律

  - key: 民事诉讼法第225条
    law: 中华人民共和国民事诉讼法
    article: 225
    title: 支付令的申请条件
    text: "债权人请求债务人给付金钱、有价证券，符合下列条件的，可以向有管辖权的基层人民法院申请支付令：（一）债权人与债务人没有其他债务纠纷的；（二）支付令能够送达债务人的。申请书应当写明请求给付金钱或者有价证券的数量和所根据的事实、证据。"
    effective_from: "2024-01-01"
    authority: 法律

  - key: 民事诉讼法第247条
    law: 中华人民共和国民事诉讼法
    article: 247
    title: 申请执行
    text: "发生法律效力的民事判决、裁定，当事人必须履行。一方拒绝履行的，对方当事人可以向人民法院申请执行，也可以由审判员移送执行员执行。调解书和其他应当由人民法院执行的法律文书，当事人必须履行。一方拒绝履行的，对方当事人可以向人民法院申请执行。"
    effective_from: "2024-01-01"
    authority: 法律

  - key: 民事诉讼法第250条
    law: 中华人民共和国民事诉讼法
    article: 250
    title: 申请执行的期间
    text: "申请执行的期间为二年。申请执行时效的中止、中断，适用法律有关诉讼时效中止、中断的规定。前款规定的期间，从法律文书规定履行期间的最后一日起计算；法律文书规定分期履行的，从最后一期履行期限届满之日起计算；法律文书未规定履行期间的，从法律文书生效之日起计算。"
    effective_from: "2024-01-01"
    authority: 法律

  - key: 民事诉讼法第259条
    law: 中华人民共和国民事诉讼法
    article: 259
    title: 搜查令
    text: "被执行人不履行法律文书确定的义务，并隐匿财产的，人民法院有权发出搜查令，对被执行人及其住所或者财产隐匿地进行搜查。采取前款措施，由院长签发搜查令。"
    effective_from: "2024-01-01"
    authority: 法律

  # ── 民事诉讼法司法解释（2022 修正，补充）────────────────
  - key: 民诉法解释第232条
    law: 最高人民法院关于适用《中华人民共和国民事诉讼法》的解释
    article: 232
    title: 反诉与增加诉讼请求的提出时间
    text: "在案件受理后，法庭辩论结束前，原告增加诉讼请求，被告提出反诉，第三人提出与本案有关的诉讼请求，可以合并审理的，人民法院应当合并审理。"
    effective_from: "2022-04-10"
    authority: 司法解释

  - key: 民诉法解释第238条
    law: 最高人民法院关于适用《中华人民共和国民事诉讼法》的解释
    article: 238
    title: 撤诉与按撤诉处理的审查
    text: "当事人申请撤诉或者依法可以按撤诉处理的案件，如果当事人有违反法律的行为需要依法处理的，人民法院可以不准许撤诉或者不按撤诉处理。法庭辩论终结后原告申请撤诉，被告不同意的，人民法院可以不予准许。"
    effective_from: "2022-04-10"
    authority: 司法解释

  - key: 民诉法解释第427条
    law: 最高人民法院关于适用《中华人民共和国民事诉讼法》的解释
    article: 427
    title: 支付令申请的受理条件
    text: "债权人申请支付令，符合下列条件的，基层人民法院应当受理，并在收到支付令申请书后五日内通知债权人：(一)请求给付金钱或者汇票、本票、支票、股票、债券、国库券、可转让的存款单等有价证券；(二)请求给付的金钱或者有价证券已到期且数额确定，并写明了请求所根据的事实、证据；(三)债权人没有对待给付义务；(四)债务人在我国境内且未下落不明；(五)支付令能够送达债务人；(六)收到申请书的人民法院有管辖权；(七)债权人未向人民法院申请诉前保全。不符合前款规定的，人民法院应当在收到支付令申请书后五日内通知债权人不予受理。基层人民法院受理申请支付令案件，不受债权金额的限制。"
    effective_from: "2022-04-10"
    authority: 司法解释

  - key: 民诉法解释第429条
    law: 最高人民法院关于适用《中华人民共和国民事诉讼法》的解释
    article: 429
    title: 支付令的留置送达
    text: "向债务人本人送达支付令，债务人拒绝接收的，人民法院可以留置送达。"
    effective_from: "2022-04-10"
    authority: 司法解释

  # ── 律师法（2026 修正，2026.9.1 施行）──────────────────
  - key: 律师法第28条
    law: 中华人民共和国律师法
    article: 28
    title: 律师事务所统一接受委托
    text: "律师承办业务，由律师事务所统一接受委托，与委托人签订书面委托合同，按照国家规定统一收取费用并如实入账。律师事务所和律师应当依法纳税。"
    effective_from: "2026-09-01"
    authority: 法律

  - key: 律师法第30条
    law: 中华人民共和国律师法
    article: 30
    title: 律师事务所经营范围限制
    text: "律师事务所不得从事法律服务以外的经营活动。"
    effective_from: "2026-09-01"
    authority: 法律

  - key: 律师法第31条
    law: 中华人民共和国律师法
    article: 31
    title: 律师可以从事的业务范围
    text: "律师可以从事下列业务：（一）接受自然人、法人或者其他组织的委托，担任法律顾问；（二）接受民事案件、行政案件当事人的委托，担任代理人，参加诉讼；（三）接受刑事案件犯罪嫌疑人、被告人的委托或者依法接受法律援助机构的指派，担任辩护人，接受自诉案件自诉人、公诉案件被害人或者其近亲属的委托，担任代理人，参加诉讼；（四）接受委托，代理各类诉讼案件的申诉；（五）接受委托，参加调解、仲裁活动；（六）接受委托，提供非诉讼法律服务；（七）解答有关法律的询问、代写诉讼文书和有关法律事务的其他文书。"
    effective_from: "2026-09-01"
    authority: 法律

  # ── 民法典（补充）与劳动争议调解仲裁法（补充）────────────
  - key: 民法典第579条
    law: 中华人民共和国民法典
    article: 579
    title: 金钱债务的实际履行
    text: "当事人一方未支付价款、报酬、租金、利息，或者不履行其他金钱债务的，对方可以请求其支付。"
    effective_from: "2021-01-01"
    authority: 法律

  - key: 劳动争议调解仲裁法第16条
    law: 中华人民共和国劳动争议调解仲裁法
    article: 16
    title: 劳动争议调解协议后的支付令
    text: "因支付拖欠劳动报酬、工伤医疗费、经济补偿或者赔偿金事项达成调解协议，用人单位在协议约定期限内不履行的，劳动者可以持调解协议书依法向人民法院申请支付令。人民法院应当依法发出支付令。"
    effective_from: "2008-05-01"
    authority: 法律
