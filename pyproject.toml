[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-writing-samples"
version = "0.1.0"
description = "法律文书范文库：要素模型、写作大纲与法条条号校验"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "刘俊超", email = "251820244@smail.nju.edu.cn" }]
keywords = ["法律文书", "legal writing", "范文", "起诉状", "答辩状", "上诉状", "辩护词", "中国法"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing :: Markup",
    "Intended Audience :: Legal Industry",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/liujunchao-nju/legal-writing-samples"
Issues = "https://github.com/liujunchao-nju/legal-writing-samples/issues"

[project.scripts]
lws = "lws.cli:main"

[tool.setuptools]
packages = ["lws"]

[tool.setuptools.package-data]
lws = ["data/*.yaml", "data/**/*.yaml", "data/**/*.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
